# 비root 사용자로 실행하므로 pid·임시 파일 경로를 /tmp로 옮긴다
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 7860;

    # 예측 API: 계산만 하므로 공개 (/api/serve/predict, /api/serve/anomaly, /api/serve/health)
    location /api/serve/ {
      proxy_pass http://127.0.0.1:8000/;
    }
    # 수집 API: 공개 데모에서는 조회(GET)만 허용해 외부에서 가짜 데이터를 넣지 못하게 한다
    location /api/ingest/ {
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:8001/;
    }
    # 나머지는 Streamlit 대시보드 (웹소켓 업그레이드 필요)
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }
  }
}
